; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_size = 4MB

lib_deps =
    LiquidCrystal_I2C
    MFRC522
    RtcDS1302
    makuna/RTC


