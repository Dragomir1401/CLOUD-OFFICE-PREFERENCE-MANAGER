<!DOCTYPE html>
<html>
<head>
    <title>Employee Logs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Employee Logs</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>UID</th>
                <th>Login Time</th>
                <th>Temperature (°C)</th>
                <th>Humidity (%)</th>
                <th>Reminder</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee.name }}</td>
                <td>{{ employee.uid }}</td>
                <td>{{ employee.time }}</td>
                <td>{{ employee.temperature }}</td>
                <td>{{ employee.humidity }}</td>
                <td>{{ employee.reminder }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
