<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Records</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Employee Logins</h1>

    <!-- Records Table -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>UID</th>
                <th>Time</th>
                <th>Temperature</th>
                <th>Humidity</th>
                <th>Reminder</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.name }}</td>
                <td>{{ log.uid }}</td>
                <td>{{ log.time }}</td>
                <td>{{ log.temperature }}</td>
                <td>{{ log.humidity }}</td>
                <td>{{ log.reminder }}</td>
                <td>{{ log.type }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
