<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Reminders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Set Reminders</h1>

    <form id="reminderForm">
        <div class="form-group">
            <label for="userId">User ID</label>
            <input type="text" class="form-control" id="userId" name="id" required>
        </div>
        <div class="form-group">
            <label for="reminderText">Reminder</label>
            <input type="text" class="form-control" id="reminderText" name="reminder" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Set Reminder</button>
    </form>
    <div id="responseMessage"></div>
</div>

<script>
    document.getElementById("reminderForm").addEventListener("submit", function(event){
        event.preventDefault();
        
        let userId = document.getElementById("userId").value;
        let reminder = document.getElementById("reminderText").value;

        fetch('/set_reminder', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: userId,
                reminder: reminder
            })
        })
        .then(response => response.json())
        .then(data => {
            let responseMessage = document.getElementById("responseMessage");
            if(data.status === 'success') {
                responseMessage.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                responseMessage.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
