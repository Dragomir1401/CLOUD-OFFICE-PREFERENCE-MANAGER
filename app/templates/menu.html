<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>

<!-- Main Menu -->
<div class="container text-center mt-5">
    <h1>Welcome to the Office Preferences System</h1>
    <div class="list-group mt-4">
        <a href="/records" class="list-group-item list-group-item-action" id="recordsMenu">Records</a>
        <a href="/users" class="list-group-item list-group-item-action" id="usersMenu">See Users</a>
        <a href="/preferences" class="list-group-item list-group-item-action" id="preferencesMenu">Preferences</a>
        <a href="/visualization" class="list-group-item list-group-item-action" id="visualizationMenu">Visualization</a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Highlight the active menu item based on the current page
        const currentPage = window.location.pathname;
        if (currentPage.includes("records")) {
            document.getElementById("recordsMenu").classList.add("active");
        } else if (currentPage.includes("users")) {
            document.getElementById("usersMenu").classList.add("active");
        } else if (currentPage.includes("preferences")) {
            document.getElementById("preferencesMenu").classList.add("active");
        }
    });
</script>

</body>
</html>
