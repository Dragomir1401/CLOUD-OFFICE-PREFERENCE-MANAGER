<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Preferences</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Preferences Tab -->
<div class="container mt-5">
    <h1 class="text-center mb-4">Update User Preferences</h1>

    <form id="preferencesForm">
        <div class="mb-3">
            <label for="userId" class="form-label">User ID</label>
            <input type="text" class="form-control" id="userId" name="id" required placeholder="Enter User ID">
        </div>
        
        <div class="mb-3">
            <label for="temp" class="form-label">Temperature (°C)</label>
            <input type="number" class="form-control" id="temp" name="temperature" step="0.1" required placeholder="Enter preferred temperature">
        </div>

        <div class="mb-3">
            <label for="humidity" class="form-label">Humidity (%)</label>
            <input type="number" class="form-control" id="humidity" name="humidity" required placeholder="Enter preferred humidity">
        </div>

        <div class="mb-3">
            <label for="reminder" class="form-label">Reminder</label>
            <input type="text" class="form-control" id="reminder" name="reminder" placeholder="Enter reminder text (optional)">
        </div>

        <div class="mb-3">
            <label for="access" class="form-label">Access</label>
            <select class="form-select" id="access" name="access">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Update Preferences</button>
    </form>
    
    <div id="responseMessage" class="mt-3"></div>
</div>

<script>
    document.getElementById("preferencesForm").addEventListener("submit", function(event){
        event.preventDefault();

        let userId = document.getElementById("userId").value;
        let temperature = document.getElementById("temp").value;
        let humidity = document.getElementById("humidity").value;
        let reminder = document.getElementById("reminder").value;
        let access = document.getElementById("access").value === 'true';

        fetch('/update_preferences', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: userId,
                preferences: {
                    temperature: temperature,
                    humidity: humidity
                },
                reminder: reminder,
                access: access
            })
        })
        .then(response => response.json())
        .then(data => {
            let responseMessage = document.getElementById("responseMessage");
            if(data.status === 'success') {
                responseMessage.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                responseMessage.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
